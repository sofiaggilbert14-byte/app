name: Frontend CI

# Always run on PRs targeting main so status checks appear even when only
# workflow/docs change. Keep this job short so it can finish while APK jobs queue.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint:
    # ubuntu-latest has the widest hosted-runner pool during capacity incidents.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # npm test uses --experimental-strip-types (Node 22+); match purple-next-ci.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Unit and wiring tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
