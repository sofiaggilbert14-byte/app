name: Phase 9 Guide State Order Repair

on:
  push:
    branches: [phase9/remote-groups-epg-player]
    paths: [frontend/ci/phase9-guide-state-order-trigger.txt]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase9/remote-groups-epg-player
          fetch-depth: 0
      - run: python3 frontend/ci/apply-phase9-guide-state-order.py
      - run: git diff --check
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/'(tabs)'/guide.tsx
          git commit -m "phase9: fix Guide drawer state initialization order"
          git push origin HEAD:phase9/remote-groups-epg-player
