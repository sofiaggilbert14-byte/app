name: Media3 Player Core Validation

on:
  push:
    branches:
      - agent/media3-player-core-rebuild
  pull_request:
    branches:
      - agent/tivimate-deep-player-quickactions-repair
    paths:
      - "frontend/**"
      - ".github/workflows/media3-player-core-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media3-player-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android compile SDK and pinned NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install dependencies and apply native Media3 tuning
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify native configuration
        run: npm run verify:native-config

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify Media3 rebuild invariants
        run: |
          grep -q 'createVideoPlayer' src/core/media3PlaybackManager.ts
          grep -q 'surfaceView' src/components/StreamPlayer.tsx
          grep -q 'onFirstFrameRender' src/components/StreamPlayer.tsx
          grep -q 'useCaching: false' src/components/StreamPlayer.tsx
          grep -q 'sharedVideoOkHttpClient' node_modules/expo-video/android/src/main/java/expo/modules/video/utils/DataSourceUtils.kt
          grep -q 'bufferForPlaybackAfterRebufferMs = maxOf' node_modules/expo-video/android/src/main/java/expo/modules/video/player/VideoPlayerLoadControl.kt
          ! grep -q 'react-native-vlc-media-player' src/components/StreamPlayer.tsx

      - name: Compile native Kotlin and Java
        env:
          CI: "1"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=1"
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android \
            :ffmpeg-audio:compileDebugJavaWithJavac \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac \
            --no-daemon --max-workers=1 --stacktrace
