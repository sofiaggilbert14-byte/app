name: Apply TiViMate Overhaul Patches

on:
  push:
    branches:
      - agent/tivimate-architecture-overhaul
    paths:
      - ci/apply-tivimate-overhaul.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/tivimate-architecture-overhaul
          fetch-depth: 0
      - name: Migrate Guide groups into drawer
        run: python ci/patch-guide-drawer.py
      - name: Commit patch results
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "Charm Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/app/'(tabs)'/guide.tsx \
                  frontend/app/'(tabs)'/settings.tsx \
                  frontend/src/components/PurpleTvShell.tsx \
                  frontend/src/core/guideUiPreferences.ts \
                  frontend/src/core/guideGroups.ts
          git commit -m "refactor(guide): move groups into drawer and reclaim grid space"
          git push origin HEAD:agent/tivimate-architecture-overhaul
