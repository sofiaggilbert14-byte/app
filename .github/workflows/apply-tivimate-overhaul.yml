name: Apply TiViMate Overhaul Patches

on:
  push:
    branches:
      - agent/tivimate-architecture-overhaul
    paths:
      - ci/apply-tivimate-overhaul.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/tivimate-architecture-overhaul
          fetch-depth: 0
      - name: Apply TiViMate-style Guide drawer remote navigation
        run: python ci/patch-guide-drawer-remote.py
      - name: Commit patch results
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "Charm Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/app/'(tabs)'/guide.tsx \
                  frontend/scripts/verify-overhaul-architecture.mjs
          git commit -m "feat(guide): open drawer from Back and left boundary"
          git push origin HEAD:agent/tivimate-architecture-overhaul
