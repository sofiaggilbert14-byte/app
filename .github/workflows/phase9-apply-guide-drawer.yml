name: Phase 9 Apply Guide Drawer

on:
  push:
    branches:
      - phase9/remote-groups-epg-player
    paths:
      - frontend/ci/phase9-guide-drawer-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 9
        uses: actions/checkout@v4
        with:
          ref: phase9/remote-groups-epg-player
          fetch-depth: 0

      - name: Apply guarded Guide drawer patch
        run: python3 frontend/ci/apply-phase9-guide-drawer.py

      - name: Verify diff
        run: git diff --check

      - name: Commit applied Guide changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/'(tabs)'/guide.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "phase9: separate Guide groups drawer and restore long OK favorite"
          git push origin HEAD:phase9/remote-groups-epg-player
