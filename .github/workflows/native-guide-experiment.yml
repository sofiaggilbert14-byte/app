name: Native Guide Experiment APK

on:
  push:
    branches: [experiment/native-guide-canvas]
    paths: ["frontend/**", ".github/workflows/native-guide-experiment.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_PUBLIC_M3U_URL: ${{ secrets.M3U_URL || vars.EXPO_PUBLIC_M3U_URL }}
      EXPO_PUBLIC_EPG_URL: ${{ secrets.EPG_URL || vars.EXPO_PUBLIC_EPG_URL }}
      EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ vars.EXPO_PUBLIC_GUIDE_WINDOW_HOURS || '6' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Build pinned LGPL FFmpeg audio extension
        run: |
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"
          chmod +x scripts/build-media3-ffmpeg-audio.sh
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.1.12297006" ./scripts/build-media3-ffmpeg-audio.sh
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Validate architecture and native configuration
        run: npm run verify:native-guide && npm run verify:native-config
      - name: Validate TypeScript, lint, and tests
        run: npm run typecheck && npm run lint && npm test
      - name: Build universal sideload APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleSideload --no-daemon --stacktrace
      - name: Package APK
        run: |
          mkdir -p artifact
          cp android/app/build/outputs/apk/sideload/app-sideload.apk artifact/CharmIPTV-Native-Guide.apk
          sha256sum artifact/CharmIPTV-Native-Guide.apk > artifact/CharmIPTV-Native-Guide.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CharmIPTV-Native-Guide-${{ github.sha }}
          path: frontend/artifact/*
          if-no-files-found: error
          retention-days: 30
