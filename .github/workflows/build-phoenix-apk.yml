      - name: Collect release APKs
        if: success()
        run: |
          mkdir -p frontend/artifacts
          cp -v android/app/build/outputs/apk/release/*.apk frontend/artifacts/ || true

      - name: Upload release APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: charm-iptv-release-apk
          path: frontend/artifacts
          if-no-files-found: error
