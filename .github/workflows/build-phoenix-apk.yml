name: Build Charm IPTV Experimental APK (capture-logs)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/build-phoenix-apk.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/build-phoenix-apk.yml"

permissions:
  contents: read

concurrency:
  group: experimental-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Experimental Android TV release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_PUBLIC_M3U_URL: ${{ vars.EXPO_PUBLIC_M3U_URL }}
      EXPO_PUBLIC_EPG_URL: ${{ vars.EXPO_PUBLIC_EPG_URL }}
      EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ vars.EXPO_PUBLIC_GUIDE_WINDOW_HOURS || '8' }}
      CMAKE_BUILD_PARALLEL_LEVEL: "1"

    steps:
      - name: Checkout Experimental
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps

      - name: Validate Experimental
        run: |
          npm run typecheck
          npm run lint

      - name: Stamp Experimental build version
        shell: bash
        run: |
          EXPERIMENTAL_VERSION="2.0.${GITHUB_RUN_NUMBER}-beta"
          EXPERIMENTAL_VERSION_CODE=$((2000 + GITHUB_RUN_NUMBER))
          EXPERIMENTAL_APK_NAME="CharmIPTV Experimental Universal v${EXPERIMENTAL_VERSION}.apk"
          export EXPERIMENTAL_VERSION EXPERIMENTAL_VERSION_CODE
          node - <<'NODE'
          const fs = require("fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          app.expo.version = process.env.EXPERIMENTAL_VERSION;
          app.expo.android = app.expo.android || {};
          app.expo.android.versionCode = Number(process.env.EXPERIMENTAL_VERSION_CODE);
          fs.writeFileSync("app.json", `${JSON.stringify(app, null, 2)}\n`);
          NODE
          echo "EXPERIMENTAL_VERSION=${EXPERIMENTAL_VERSION}" >> "$GITHUB_ENV"
          echo "EXPERIMENTAL_VERSION_CODE=${EXPERIMENTAL_VERSION_CODE}" >> "$GITHUB_ENV"
          echo "EXPERIMENTAL_APK_NAME=${EXPERIMENTAL_APK_NAME}" >> "$GITHUB_ENV"
          echo "Stamped Experimental ${EXPERIMENTAL_VERSION} (${EXPERIMENTAL_VERSION_CODE})"

      - name: Regenerate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Configure cloud build resources
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.workers.max=1
          org.gradle.vfs.watch=false
          kotlin.compiler.execution.strategy=in-process
          kotlin.daemon.enabled=false
          reactNativeArchitectures=armeabi-v7a,arm64-v8a
          EOF

      - name: Precompile Kotlin UI module (capture)
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :react-native-screens:compileReleaseKotlin --no-daemon --max-workers=1 --debug --warning-mode=all --stacktrace |& tee artifacts/gradle-precompile.log

      - name: Build standalone universal release APK (capture)
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:assembleRelease --no-daemon --max-workers=1 --debug --warning-mode=all --stacktrace |& tee artifacts/gradle-assemble.log

      - name: Collect Gradle problems report
        if: failure()
        run: |
          PROBLEMS=android/build/reports/problems/problems-report.html
          if [ -f "$PROBLEMS" ]; then
            echo "Problems report found, copying to artifacts..."
            cp "$PROBLEMS" artifacts/problems-report.html
          else
            echo "No problems report found"
          fi

      - name: Dump problems report to log
        if: failure()
        run: |
          PROBLEMS=android/build/reports/problems/problems-report.html
          if [ -f "$PROBLEMS" ]; then
            echo "=== problems-report.html (first 400 lines) ==="
            sed -n '1,400p' "$PROBLEMS" || true
            echo "=== problems-report.html (lines 401-800) ==="
            sed -n '401,800p' "$PROBLEMS" || true
          else
            echo "No problems report found at $PROBLEMS"
          fi

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: frontend/artifacts
          if-no-files-found: warn
