name: Code Interaction Audit Native Compile

on:
  push:
    branches:
      - agent/code-interaction-audit
    paths:
      - ci/code-interaction-audit-native.trigger

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/code-interaction-audit
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Compile exact audit source
        shell: bash
        run: |
          set +e
          source_head=$(git rev-parse HEAD)
          npm ci --legacy-peer-deps --no-audit --no-fund
          install=$?
          verify=99
          compile=99
          if [ "$install" -eq 0 ]; then
            npm run verify:native-config
            verify=$?
          fi
          if [ "$install" -eq 0 ] && [ "$verify" -eq 0 ]; then
            chmod +x android/gradlew
            ./android/gradlew -p android \
              :ffmpeg-audio:compileDebugJavaWithJavac \
              :app:compileDebugKotlin \
              :app:compileDebugJavaWithJavac \
              --no-daemon --max-workers=1 --stacktrace
            compile=$?
          fi
          cd ..
          cat > ci/code-interaction-audit-native.txt <<EOF
          source_head=$source_head
          install=$install
          native_config=$verify
          android_compile=$compile
          EOF
          git config user.name "Charm Interaction Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ci/code-interaction-audit-native.txt
          if ! git diff --cached --quiet; then
            git commit -m "test(audit): record native compile"
            git push origin HEAD:agent/code-interaction-audit
          fi
          if [ "$install" -ne 0 ] || [ "$verify" -ne 0 ] || [ "$compile" -ne 0 ]; then
            exit 1
          fi
