# trigger: deep repair cycle 8
name: TiViMate Deep Player Quick Actions Repair

on:
  push:
    branches:
      - agent/tivimate-deep-player-quickactions-repair
    paths:
      - ci/tivimate-deep-player-quickactions-repair.py
      - ci/tivimate-deep-player-quickactions-repair-v2.py
      - ci/tivimate-whole-repo-player-interaction-scan.py
      - .github/workflows/tivimate-deep-player-quickactions-repair.yml
      - frontend/android/app/src/main/java/com/charmiptv/app/MainActivity.kt
      - frontend/src/components/TvQuickActionsOverlay.tsx
      - frontend/src/components/StreamPlayer.tsx
      - frontend/app/player.tsx
      - frontend/app/(tabs)/guide.tsx
      - frontend/src/store.tsx
      - frontend/patches/expo-video+3.0.16.patch

permissions:
  contents: write

jobs:
  repair-scan-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/tivimate-deep-player-quickactions-repair
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Verify TiViMate behavioral repair
        run: python ci/tivimate-deep-player-quickactions-scan.py

      - name: Repair Guide lint dependency warning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/app/(tabs)/guide.tsx')
          text = path.read_text(encoding='utf-8')
          old_start = '''  const groupCounts = useMemo(
    () =>
      buildGroupCounts(channels, {
'''
          new_start = '''  const groupCounts = useMemo(
    () => {
      // streamFailureRegistry is module-owned state. Keep its count in this memo
      // contract so Failed-group counts are recomputed on the next render after
      // registry changes without rebuilding unrelated guide data.
      void failedCount;
      return buildGroupCounts(channels, {
'''
          old_end = '''        includeProviderGroups: showProviderGroups,
      }),
    [channels, favoriteSet, recentIdSet, hasOwnedEpgMatch, hiddenIdSet, failedCount, epgGuideFilter, customGuideGroups.byName, showProviderGroups],
  );
'''
          new_end = '''        includeProviderGroups: showProviderGroups,
      });
    },
    [channels, favoriteSet, recentIdSet, hasOwnedEpgMatch, hiddenIdSet, failedCount, customGuideGroups.byName, showProviderGroups],
  );
'''
          if old_start in text and old_end in text:
              text = text.replace(old_start, new_start, 1).replace(old_end, new_end, 1)
              path.write_text(text, encoding='utf-8')
          elif new_start not in text or new_end not in text:
              raise SystemExit('Guide groupCounts lint-repair shape changed unexpectedly')
          PY

      - name: Preserve 24-hour guide runtime default
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/store.tsx')
          text = path.read_text(encoding='utf-8')
          new = 'const DEFAULT_GUIDE_WINDOW_HOURS = readGuideWindowHours(process.env.EXPO_PUBLIC_GUIDE_WINDOW_HOURS, 24);'
          if new not in text:
              raise SystemExit('Guide default window contract changed unexpectedly')
          PY

      - name: Guard repair-entry M3U and EPG transport baseline
        shell: bash
        run: |
          git diff --exit-code a98c49e8631f2c0e90be7cfb630395c75ada09ec -- \
            frontend/src/source.native.ts \
            frontend/src/nativeEpg.ts \
            frontend/android/app/src/main/java/com/charmiptv/app/EpgNativeModule.kt

      - name: Player decoder codec bleed scan
        run: python ci/code-interaction-audit-player-freeze-scan.py

      - name: Preview fullscreen lifecycle scan
        run: python ci/code-interaction-audit-preview-lifecycle-scan.py

      - name: Whole app RAM cache lifecycle scan
        run: python ci/code-interaction-audit-lifecycle-scan.py

      - name: Whole repository player interaction scan
        run: python ci/tivimate-whole-repo-player-interaction-scan.py

      - name: Settings Guide EPG lifecycle scan
        run: python ci/code-interaction-audit-settings-lifecycle-scan.py

      - name: EPG schedule isolation scan
        run: python ci/code-interaction-audit-epg-schedule-lifecycle-scan.py

      - name: Guide modal input ownership scan
        run: python ci/code-interaction-audit-guide-modal-lifecycle-scan.py

      - name: Drawer preview surface ownership scan
        run: python ci/code-interaction-audit-surface-ownership-scan.py

      - name: Player stability contract scan
        run: python ci/code-interaction-audit-player-stability.py

      - name: Preview isolation contract scan
        run: python ci/code-interaction-audit-preview-isolation.py

      - name: Install JavaScript dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Unit and interaction tests
        working-directory: frontend
        run: npm test

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint with zero warnings
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: Verify native configuration
        working-directory: frontend
        run: npm run verify:native-config

      - name: Compile FFmpeg Media3 and app native bridge
        working-directory: frontend
        env:
          CI: '1'
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=1'
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android \
            :ffmpeg-audio:compileDebugJavaWithJavac \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac \
            --no-daemon --max-workers=1 --stacktrace

      - name: Validate repair patch shape
        run: git diff --check

      - name: Commit verified deep repair
        shell: bash
        run: |
          git config user.name "Charm Interaction Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            frontend/android/app/src/main/java/com/charmiptv/app/MainActivity.kt \
            frontend/src/components/TvQuickActionsOverlay.tsx \
            frontend/src/components/StreamPlayer.tsx \
            frontend/app/player.tsx \
            frontend/app/'(tabs)'/guide.tsx \
            frontend/src/store.tsx \
            frontend/patches/expo-video+3.0.16.patch
          if git diff --cached --quiet; then
            echo "No production repair changes needed"
            exit 0
          fi
          git commit -m "fix(tivimate): converge player recovery Guide lint and 24h EPG"
          git push origin HEAD:agent/tivimate-deep-player-quickactions-repair
