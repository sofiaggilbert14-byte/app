name: TiViMate Deep Player Quick Actions Gate

on:
  pull_request:
    branches:
      - agent/code-interaction-audit
    paths:
      - ci/tivimate-deep-player-quickactions.trigger

permissions:
  contents: write

jobs:
  repair-scan-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/tivimate-deep-player-quickactions-repair
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Apply TiViMate behavioral repair
        run: python ci/tivimate-deep-player-quickactions-repair-v2.py

      - name: TiViMate deep repair contract scan
        run: python ci/tivimate-deep-player-quickactions-scan.py

      - name: Player decoder codec bleed scan
        run: python ci/code-interaction-audit-player-freeze-scan.py

      - name: Preview fullscreen lifecycle scan
        run: python ci/code-interaction-audit-preview-lifecycle-scan.py

      - name: Whole app RAM cache lifecycle scan
        run: python ci/code-interaction-audit-lifecycle-scan.py

      - name: Settings Guide EPG lifecycle scan
        run: python ci/code-interaction-audit-settings-lifecycle-scan.py

      - name: EPG schedule isolation scan
        run: python ci/code-interaction-audit-epg-schedule-lifecycle-scan.py

      - name: Guide modal input ownership scan
        run: python ci/code-interaction-audit-guide-modal-lifecycle-scan.py

      - name: Drawer preview surface ownership scan
        run: python ci/code-interaction-audit-surface-ownership-scan.py

      - name: Install JavaScript dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Unit and interaction tests
        id: unit_tests
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/charm-unit-tests.log
          status=${PIPESTATUS[0]}
          tail -n 260 /tmp/charm-unit-tests.log > ../ci/tivimate-latest-unit-test.txt
          exit "$status"

      - name: Publish unit failure diagnostic
        if: ${{ failure() && steps.unit_tests.outcome == 'failure' }}
        shell: bash
        run: |
          git config user.name "Charm Interaction Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ci/tivimate-latest-unit-test.txt
          if git diff --cached --quiet; then
            echo "Unit diagnostic unchanged"
            exit 0
          fi
          git commit -m "ci(tivimate): capture failing unit diagnostics"
          git push origin HEAD:agent/tivimate-deep-player-quickactions-repair

      - name: Typecheck
        id: typecheck
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/charm-typecheck.log
          exit ${PIPESTATUS[0]}

      - name: Lint
        id: lint
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee /tmp/charm-lint.log
          exit ${PIPESTATUS[0]}

      - name: Verify native configuration
        id: native_config
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run verify:native-config 2>&1 | tee /tmp/charm-native-config.log
          exit ${PIPESTATUS[0]}

      - name: Compile FFmpeg Media3 and app native bridge
        id: native_compile
        working-directory: frontend
        shell: bash
        env:
          CI: '1'
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=1'
        run: |
          set +e
          chmod +x android/gradlew
          ./android/gradlew -p android \
            :ffmpeg-audio:compileDebugJavaWithJavac \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac \
            --no-daemon --max-workers=1 --stacktrace 2>&1 | tee /tmp/charm-native-compile.log
          exit ${PIPESTATUS[0]}

      - name: Publish post-unit failure diagnostic
        if: ${{ failure() && steps.unit_tests.outcome != 'failure' }}
        shell: bash
        run: |
          {
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "native_config=${{ steps.native_config.outcome }}"
            echo "native_compile=${{ steps.native_compile.outcome }}"
            for file in /tmp/charm-typecheck.log /tmp/charm-lint.log /tmp/charm-native-config.log /tmp/charm-native-compile.log; do
              if [ -f "$file" ]; then
                echo
                echo "===== $file ====="
                tail -n 220 "$file"
              fi
            done
          } > ci/tivimate-latest-post-unit.txt
          git config user.name "Charm Interaction Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ci/tivimate-latest-post-unit.txt
          if git diff --cached --quiet; then
            echo "Post-unit diagnostic unchanged"
            exit 0
          fi
          git commit -m "ci(tivimate): capture post-unit gate diagnostics"
          git push origin HEAD:agent/tivimate-deep-player-quickactions-repair

      - name: Validate repair patch shape
        run: git diff --check

      - name: Commit verified deep repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git config user.name "Charm Interaction Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            frontend/android/app/src/main/java/com/charmiptv/app/MainActivity.kt \
            frontend/src/components/TvQuickActionsOverlay.tsx \
            frontend/src/components/StreamPlayer.tsx \
            frontend/app/player.tsx \
            frontend/patches/expo-video+3.0.16.patch \
            ci/code-interaction-audit-player-freeze-report.txt
          git commit -m "fix(tivimate): repair player recovery and Quick Actions ownership"
          git push origin HEAD:agent/tivimate-deep-player-quickactions-repair
