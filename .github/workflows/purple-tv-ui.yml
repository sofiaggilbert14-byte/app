name: Build CharmIPTV Purple TV APK

on:
  # APK builds burn ~20–50 Actions minutes each. Do not run on every PR —
  # only main pushes + manual dispatch (saves budget when the org is near quota).
  push:
    branches:
      - main
      - experimental/purple-tv-ui
    paths:
      - 'frontend/**'
      - '.github/workflows/purple-tv-ui.yml'
  workflow_dispatch:

# Do not cancel in-progress APK builds — runner queues are long, and merge/retrigger
# events were wiping queued jobs before they ever got a runner.
concurrency:
  group: purple-tv-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-apk:
    # Prefer the largest hosted pool; pin only if a package needs 24.04 specifically.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Release upload needs contents:write. Artifact upload is best-effort when
    # Actions storage quota is exhausted (caches + prior APKs share that quota).
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: frontend
    env:
      # Prefer repository secrets (M3U_URL / EPG_URL — same as charm-refresh).
      # Optional vars.EXPO_PUBLIC_* remain as fallbacks for older Phoenix wiring.
      EXPO_PUBLIC_M3U_URL: ${{ secrets.M3U_URL || vars.EXPO_PUBLIC_M3U_URL }}
      EXPO_PUBLIC_EPG_URL: ${{ secrets.EPG_URL || vars.EXPO_PUBLIC_EPG_URL }}
      EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ vars.EXPO_PUBLIC_GUIDE_WINDOW_HOURS || '8' }}

    steps:
      - name: Checkout purple TV UI
        uses: actions/checkout@v4

      - name: Require playlist and EPG build configuration
        run: |
          if [ -z "${EXPO_PUBLIC_M3U_URL}" ] || [ -z "${EXPO_PUBLIC_EPG_URL}" ]; then
            echo "::error::Missing playlist/EPG config. Set repository secrets M3U_URL and EPG_URL (Settings → Secrets and variables → Actions → Secrets), or variables EXPO_PUBLIC_M3U_URL / EXPO_PUBLIC_EPG_URL."
            exit 1
          fi
          echo "Playlist/EPG build configuration is present (values not printed)."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Shared Actions storage includes caches; prune unused entries after success
          # so APK artifact uploads are less likely to hit the org quota.
          cache-cleanup: on-success

      - name: Install Android native toolchain
        uses: android-actions/setup-android@v3

      - name: Build LGPL Media3 FFmpeg audio extension
        run: |
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"
          chmod +x scripts/build-media3-ffmpeg-audio.sh
          ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.1.12297006" ./scripts/build-media3-ffmpeg-audio.sh

      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build universal release APK
        run: ./android/gradlew -p android assembleRelease --no-daemon --stacktrace
        env:
          CI: '1'
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2'
          EXPO_PUBLIC_M3U_URL: ${{ env.EXPO_PUBLIC_M3U_URL }}
          EXPO_PUBLIC_EPG_URL: ${{ env.EXPO_PUBLIC_EPG_URL }}
          EXPO_PUBLIC_GUIDE_WINDOW_HOURS: ${{ env.EXPO_PUBLIC_GUIDE_WINDOW_HOURS }}

      - name: Verify universal APK contents
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E "(index\.android\.bundle|assets/.*\.bundle|resources\.arsc)" >/dev/null
          # FFmpeg Media3 extension must ship for AC-3/E-AC-3/DTS software decode.
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libffmpegJNI\.so' >/dev/null
          unzip -l "$APK" | grep -E 'lib/armeabi-v7a/libffmpegJNI\.so' >/dev/null
          cp "$APK" "android/app/build/outputs/apk/release/CharmIPTV-Purple-TV-Universal.apk"

      # Best-effort: Actions artifact storage is shared with caches and may be full.
      # Job still succeeds if this fails when a Release asset is published below.
      - name: Upload purple TV APK artifact
        id: upload_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CharmIPTV-Purple-TV-Universal
          path: frontend/android/app/build/outputs/apk/release/CharmIPTV-Purple-TV-Universal.apk
          if-no-files-found: error
          retention-days: 3

      # Releases do not consume Actions artifact storage — reliable APK delivery.
      - name: Publish purple TV APK release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: purple-tv-${{ github.run_id }}
          name: Purple TV APK — ${{ github.sha }}
          body: |
            CharmIPTV Purple TV universal APK from `${{ github.sha }}`.

            - Workflow: Build CharmIPTV Purple TV APK
            - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Event: `${{ github.event_name }}`

            ### Install
            ```
            adb install -r CharmIPTV-Purple-TV-Universal.apk
            ```
          files: frontend/android/app/build/outputs/apk/release/CharmIPTV-Purple-TV-Universal.apk
          prerelease: true
          fail_on_unmatched_files: true

      - name: Fail if neither artifact nor release was published
        if: |
          steps.upload_artifact.outcome != 'success' &&
          !(github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: |
          echo "::error::APK artifact upload failed and this event does not publish a GitHub Release."
          exit 1
