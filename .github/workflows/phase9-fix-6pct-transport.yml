name: Phase 9 Fix 6 Percent Playlist Transport

on:
  push:
    branches:
      - agent/phase9-tivimate-scan-repair
    paths:
      - ".github/workflows/phase9-fix-6pct-transport.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/phase9-tivimate-scan-repair
      - name: Apply 6 percent transport repair
        run: python ci/phase9-fix-6pct-transport.py
      - name: Run focused native platform regression
        working-directory: frontend
        run: node --experimental-strip-types tests/nativePlatformHardening.test.mjs
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/android/app/src/main/java/com/charmiptv/app/NativePlaylistParser.kt frontend/tests/nativePlatformHardening.test.mjs
          git commit -m "fix(startup): restore working playlist transport at 6 percent"
          git push origin HEAD:agent/phase9-tivimate-scan-repair
