name: Deploy CharmIPTV Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-backend/worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare-worker.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Cloudflare KV binding
        shell: bash
        env:
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          if [ -z "$CF_KV_NAMESPACE_ID" ]; then
            echo "::error::CF_KV_NAMESPACE_ID is not configured"
            exit 1
          fi
          sed -i "s/REPLACE_WITH_CF_KV_NAMESPACE_ID/$CF_KV_NAMESPACE_ID/" wrangler.toml

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
