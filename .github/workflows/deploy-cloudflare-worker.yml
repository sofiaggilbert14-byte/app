name: Deploy CharmIPTV Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-backend/worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare-worker.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Cloudflare KV binding
        shell: bash
        env:
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          if [[ ! "$CF_KV_NAMESPACE_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::CF_KV_NAMESPACE_ID must contain only the 32-character namespace ID from Cloudflare KV"
            exit 1
          fi
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "wrangler.toml";
            const config = readFileSync(path, "utf8");
            writeFileSync(path, config.replace("REPLACE_WITH_CF_KV_NAMESPACE_ID", process.env.CF_KV_NAMESPACE_ID));
          '

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
