name: Build 8 Repair Validation

on:
  push:
    branches:
      - fix/purple-next-build8-tester-pass
    paths:
      - "frontend/**"
      - ".github/workflows/build8-fix-validation.yml"

permissions:
  contents: write

concurrency:
  group: build8-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Verify native config
        id: native_config
        continue-on-error: true
        run: npm run verify:native-config
      - name: Expo doctor
        id: doctor
        continue-on-error: true
        run: npm run doctor 2>&1 | tee /tmp/build8-doctor.log
      - name: Unit and wiring tests
        id: tests
        continue-on-error: true
        run: npm test 2>&1 | tee /tmp/build8-tests.log
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Record validation result
        if: always()
        working-directory: .
        env:
          INSTALL: ${{ steps.install.outcome }}
          NATIVE_CONFIG: ${{ steps.native_config.outcome }}
          DOCTOR: ${{ steps.doctor.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: |
          cat > .build8-validation-status.txt <<EOF
          source_sha=${GITHUB_SHA}
          install=${INSTALL}
          native_config=${NATIVE_CONFIG}
          doctor=${DOCTOR}
          tests=${TESTS}
          typecheck=${TYPECHECK}
          lint=${LINT}
          EOF
          if [ "${DOCTOR}" != success ] && [ -f /tmp/build8-doctor.log ]; then
            printf '\n--- doctor tail ---\n' >> .build8-validation-status.txt
            tail -n 60 /tmp/build8-doctor.log >> .build8-validation-status.txt
          fi
          if [ "${TESTS}" != success ] && [ -f /tmp/build8-tests.log ]; then
            printf '\n--- tests tail ---\n' >> .build8-validation-status.txt
            tail -n 100 /tmp/build8-tests.log >> .build8-validation-status.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build8-validation-status.txt
          git commit -m "Record Build 8 validation result" || true
          git push
          if [ "${INSTALL}" != success ] || [ "${NATIVE_CONFIG}" != success ] || [ "${DOCTOR}" != success ] || [ "${TESTS}" != success ] || [ "${TYPECHECK}" != success ] || [ "${LINT}" != success ]; then
            exit 1
          fi
