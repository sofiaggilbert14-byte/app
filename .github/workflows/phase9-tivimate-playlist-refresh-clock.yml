name: Phase 9 TiviMate Playlist Refresh Clock

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - ".github/workflows/phase9-tivimate-playlist-refresh-clock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Add targeted native refresh-clock update
        run: |
          python - <<'PY'
          from pathlib import Path

          native = Path('frontend/android/app/src/main/java/com/charmiptv/app/EpgNativeModule.kt')
          n = native.read_text()
          marker = '  @ReactMethod\n  fun isPlaylistCurrent(contentFingerprint: String, promise: Promise) {\n'
          method = '''  @ReactMethod\n  fun touchPlaylistRefresh(playlistEpoch: Double, promise: Promise) {\n    refreshExecutor.execute {\n      try {\n        val now = System.currentTimeMillis()\n        database.setMeta("playlist_epoch", playlistEpoch.toLong().coerceAtLeast(0L).toString())\n        database.setMeta("playlist_refreshed_at", now.toString())\n        promise.resolve(true)\n      } catch (t: Throwable) {\n        promise.reject("EPG_PLAYLIST_TOUCH_FAILED", t.message ?: "Could not update playlist refresh clock", t)\n      }\n    }\n  }\n\n'''
          if 'fun touchPlaylistRefresh(' not in n:
              if marker not in n: raise SystemExit('playlist current marker not found')
              n = n.replace(marker, method + marker, 1)
          native.write_text(n)

          bridge = Path('frontend/src/nativeEpg.ts')
          b = bridge.read_text()
          if 'touchPlaylistRefresh?' not in b:
              b = b.replace(
                  '  isPlaylistCurrent?(contentFingerprint: string): Promise<boolean>;\n',
                  '  isPlaylistCurrent?(contentFingerprint: string): Promise<boolean>;\n  touchPlaylistRefresh?(playlistEpoch: number): Promise<boolean>;\n',
                  1,
              )
          marker2 = '''export async function nativePlaylistIsCurrent(contentFingerprint: string): Promise<boolean> {\n  if (!nativeModule?.isPlaylistCurrent) return false;\n  return nativeModule.isPlaylistCurrent(contentFingerprint);\n}\n'''
          method2 = marker2 + '''\nexport async function touchNativePlaylistRefresh(playlistEpoch: number): Promise<void> {\n  if (nativeModule?.touchPlaylistRefresh) {\n    await nativeModule.touchPlaylistRefresh(playlistEpoch);\n  }\n}\n'''
          if 'export async function touchNativePlaylistRefresh' not in b:
              if marker2 not in b: raise SystemExit('nativePlaylistIsCurrent wrapper marker not found')
              b = b.replace(marker2, method2, 1)
          bridge.write_text(b)

          source = Path('frontend/src/source.native.ts')
          s = source.read_text()
          if 'touchNativePlaylistRefresh,' not in s:
              s = s.replace(
                  '  nativePlaylistIsCurrent,\n',
                  '  nativePlaylistIsCurrent,\n  touchNativePlaylistRefresh,\n',
                  1,
              )
          old = '''  const contentFingerprint = playlistNativeContentFingerprint(channels);\n  if (await nativePlaylistIsCurrent(contentFingerprint)) return;\n  await upsertNativePlaylistChannels('''
          new = '''  const contentFingerprint = playlistNativeContentFingerprint(channels);\n  if (await nativePlaylistIsCurrent(contentFingerprint)) {\n    await touchNativePlaylistRefresh(playlistEpoch);\n    return;\n  }\n  await upsertNativePlaylistChannels('''
          if 'await touchNativePlaylistRefresh(playlistEpoch);' not in s:
              if old not in s: raise SystemExit('native playlist fingerprint marker not found')
              s = s.replace(old, new, 1)
          source.write_text(s)
          PY
      - name: Commit refresh clock fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/android/app/src/main/java/com/charmiptv/app/EpgNativeModule.kt frontend/src/nativeEpg.ts frontend/src/source.native.ts
          git commit -m "phase9: advance native playlist refresh clock on no-change sync"
          git push origin HEAD:phase9/purple-next
