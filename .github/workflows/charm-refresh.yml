name: Refresh Charm IPTV data

# Rebuilds channels + EPG and pushes optimized JSON to Cloudflare KV.
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC)
  workflow_dispatch: {} # lets you run it manually from the Actions tab

concurrency:
  group: charm-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build data & upload to Cloudflare KV
        run: node cloudflare-backend/scripts/build-and-upload.mjs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          M3U_URL: "http://m3u4u.com/m3u/jwmzn1grpmu99585n721"
          EPG_URL: "http://m3u4u.com/epg/jwmzn1grpmu99585n721"
          APP_VERSION: "1.0.0"
          MAINTENANCE: "false"
