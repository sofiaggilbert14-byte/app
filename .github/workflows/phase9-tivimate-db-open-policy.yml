name: Phase 9 TiviMate DB Open Policy

on:
  push:
    branches:
      - phase9/purple-next
    paths:
      - ".github/workflows/phase9-tivimate-db-open-policy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase9/purple-next
      - name: Add busy timeout and fresh-install soft-delete index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/android/app/src/main/java/com/charmiptv/app/EpgDatabase.kt')
          s = p.read_text()
          old = '    db.execSQL("PRAGMA synchronous=NORMAL")\n    db.execSQL("PRAGMA temp_store=MEMORY")\n'
          new = '    db.execSQL("PRAGMA synchronous=NORMAL")\n    db.execSQL("PRAGMA busy_timeout=3000")\n    db.execSQL("PRAGMA temp_store=MEMORY")\n'
          if 'PRAGMA busy_timeout=3000' not in s:
              if old not in s:
                  raise SystemExit('onConfigure marker not found')
              s = s.replace(old, new, 1)
          idx = '    db.execSQL("CREATE INDEX IF NOT EXISTS idx_playlist_norm_name ON $PLAYLIST_TABLE(norm_name)")\n'
          idx_new = idx + '    db.execSQL("CREATE INDEX IF NOT EXISTS idx_playlist_deleted ON $PLAYLIST_TABLE(deleted_at)")\n'
          if 'idx_playlist_deleted ON $PLAYLIST_TABLE(deleted_at)' not in s.split('override fun onUpgrade', 1)[0]:
              if idx not in s:
                  raise SystemExit('playlist index marker not found')
              s = s.replace(idx, idx_new, 1)
          p.write_text(s)
          PY
      - name: Commit database policy
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/android/app/src/main/java/com/charmiptv/app/EpgDatabase.kt
          git commit -m "phase9: align WAL busy timeout and playlist index"
          git push origin HEAD:phase9/purple-next
