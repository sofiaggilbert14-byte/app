name: Phase 9 Apply Foundation

on:
  push:
    branches:
      - phase9/remote-groups-epg-player
    paths:
      - frontend/ci/phase9-foundation-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 9
        uses: actions/checkout@v4
        with:
          ref: phase9/remote-groups-epg-player
          fetch-depth: 0

      - name: Apply guarded Phase 9 foundation patch
        run: python3 frontend/ci/apply-phase9-foundation.py

      - name: Verify diff
        run: git diff --check

      - name: Commit applied source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/android/app/src/main/java/com/charmiptv/app/MainActivity.kt \
                  frontend/android/app/src/main/java/com/charmiptv/app/TvRemoteModule.kt \
                  frontend/src/components/StreamPlayer.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "phase9: stabilize player and remote ownership foundation"
          git push origin HEAD:phase9/remote-groups-epg-player
