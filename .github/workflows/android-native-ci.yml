name: Android Native Compile

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/android/**"
      - "frontend/plugins/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/app.json"
      - "frontend/scripts/verify-native-config.mjs"
      - ".github/workflows/android-native-ci.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/android/**"
      - "frontend/plugins/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/app.json"
      - "frontend/scripts/verify-native-config.mjs"
      - ".github/workflows/android-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Kotlin and Java compile (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android compile SDK and pinned NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify checked-in Android configuration
        run: npm run verify:native-config

      - name: Compile native Kotlin and Java only
        env:
          CI: "1"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=1"
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android \
            :ffmpeg-audio:compileDebugJavaWithJavac \
            :app:compileDebugKotlin \
            :app:compileDebugJavaWithJavac \
            --no-daemon --max-workers=1 --stacktrace

      - name: Confirm compile gate produced no APK
        run: test ! -d android/app/build/outputs/apk
