diff --git a/frontend/android/app/build.gradle b/frontend/android/app/build.gradle
index 123..456
--- a/frontend/android/app/build.gradle
+++ b/frontend/android/app/build.gradle
@@
     release {
@@
-            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
-            shrinkResources enableShrinkResources.toBoolean()
-            minifyEnabled enableMinifyInReleaseBuilds
-            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
+            // Enable resource shrinking and code minification for release builds to reduce APK size and memory usage.
+            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'true'
+            shrinkResources enableShrinkResources.toBoolean()
+            // Enable R8/ProGuard
+            minifyEnabled true
+            // Use the optimized ProGuard rules file for better shrinking.
+            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
+            // Avoid debuggable in release builds.
+            debuggable false
@@
     packagingOptions {
         jniLibs {
-            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
-            useLegacyPackaging enableLegacyPackaging.toBoolean()
+            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
+            useLegacyPackaging enableLegacyPackaging.toBoolean()
+            // Strip debug symbols for release to reduce native binary size
+            doNotStrip "*/libhermes.so"
         }
     }
+
+    // Configure splits to avoid shipping universal APKs that contain all ABIs
+    splits {
+        abi {
+            enable true
+            reset()
+            include "armeabi-v7a", "arm64-v8a"
+            universalApk false
+        }
+    }
 }
