plugins {
    id 'com.android.library'
}

android {
    namespace 'androidx.media3.decoder.ffmpeg'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        consumerProguardFiles 'proguard-rules.pro'
    }

    // The module remains buildable without FFmpeg binaries for local JS work;
    // FfmpegLibrary then reports unavailable. CI runs the pinned source build
    // before assembleRelease, which enables this native target.
    def ffmpegLibs = file('src/main/jni/ffmpeg/android-libs')
    if (ffmpegLibs.exists()) {
        externalNativeBuild {
            cmake {
                path file('src/main/jni/CMakeLists.txt')
                version '3.22.1'
            }
        }
    } else if (System.getenv('CI') == '1') {
        throw new GradleException(
            "FFmpeg android-libs missing under ffmpeg-audio. " +
            "Run scripts/build-media3-ffmpeg-audio.sh before assembleRelease in CI."
        )
    } else {
        logger.warn(
            "ffmpeg-audio: native libs missing; Media3 will not decode AC-3/E-AC-3/DTS " +
            "until scripts/build-media3-ffmpeg-audio.sh is run."
        )
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-decoder:1.8.0'
    implementation 'androidx.annotation:annotation:1.9.1'
}
